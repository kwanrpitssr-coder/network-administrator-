<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Curriculum Portal</title>
  
  <!-- Markdown parser and sanitizer -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>

  <style>
    :root {
      --bg: #0b0f19;
      --surface: #151e32;
      --border: #23304a;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --sidebar-width: 320px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar Navigation */
    #sidebar {
      width: var(--sidebar-width);
      min-width: var(--sidebar-width);
      border-right: 1px solid var(--border);
      background-color: var(--surface);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .sidebar-header {
      padding: 1.25rem 1rem;
      border-bottom: 1px solid var(--border);
    }

    .sidebar-header h2 {
      margin: 0;
      font-size: 1.1rem;
      color: #fff;
    }

    .nav-group-title {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      padding: 1rem 1rem 0.25rem 1rem;
    }

    .nav-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .nav-item {
      display: block;
      padding: 0.65rem 1rem;
      color: var(--text);
      text-decoration: none;
      font-size: 0.88rem;
      cursor: pointer;
      border-left: 3px solid transparent;
      line-height: 1.35;
      transition: background 0.15s, border-color 0.15s;
    }

    .nav-item:hover {
      background-color: rgba(56, 189, 248, 0.08);
      color: #fff;
    }

    .nav-item.active {
      background-color: rgba(56, 189, 248, 0.15);
      border-left-color: var(--accent);
      color: var(--accent);
      font-weight: 600;
    }

    /* Reader View */
    #content-container {
      flex-grow: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      padding: 0.75rem 2rem;
      background-color: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .raw-link {
      color: var(--muted);
      font-size: 0.85rem;
      text-decoration: none;
      border: 1px solid var(--border);
      padding: 0.4rem 0.75rem;
      border-radius: 4px;
      transition: all 0.2s;
    }

    .raw-link:hover {
      color: var(--text);
      border-color: var(--muted);
    }

    #reader {
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      padding: 2.5rem 2rem 5rem 2rem;
      line-height: 1.6;
    }

    /* Markdown Styling */
    #reader h1 { border-bottom: 1px solid var(--border); padding-bottom: 0.4rem; color: #fff; font-size: 1.8rem; }
    #reader h2 { margin-top: 2rem; color: #f1f5f9; border-bottom: 1px solid rgba(255,255,255,0.06); padding-bottom: 0.2rem; }
    #reader h3 { color: var(--accent); }
    #reader p, #reader li { color: #cbd5e1; }
    #reader code {
      background-color: #1e293b;
      color: #38bdf8;
      padding: 0.2rem 0.4rem;
      border-radius: 4px;
      font-size: 0.88em;
    }
    #reader pre {
      background-color: #030712;
      border: 1px solid var(--border);
      padding: 1rem;
      border-radius: 6px;
      overflow-x: auto;
    }
    #reader pre code { background: none; padding: 0; color: #e2e8f0; }
    #reader table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.5rem 0;
    }
    #reader th, #reader td {
      border: 1px solid var(--border);
      padding: 0.5rem 0.75rem;
      text-align: left;
    }
    #reader th { background-color: #1a2234; }
    #reader tr:nth-child(even) { background-color: #111827; }
    
    .status-msg {
      padding: 3rem 0;
      text-align: center;
      color: var(--muted);
    }

    @media (max-width: 768px) {
      body { flex-direction: column; height: auto; overflow: visible; }
      #sidebar { width: 100%; min-width: 100%; height: auto; }
      #content-container { overflow-y: visible; }
    }
  </style>
</head>
<body>

  <!-- Navigation Sidebar -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <h2>Engineering Curriculums</h2>
    </div>
    <div id="nav-container"></div>
  </aside>

  <!-- Content Reader -->
  <main id="content-container">
    <div class="topbar">
      <span id="current-title" style="font-weight: 500; font-size: 0.9rem; color: var(--muted);">Loading...</span>
      <a id="direct-file-link" class="raw-link" href="#" target="_blank" rel="noopener noreferrer">View Markdown File</a>
    </div>
    <article id="reader">
      <div class="status-msg">Select a document from the sidebar to view.</div>
    </article>
  </main>

  <script>
    // Exact file directory mapping
    const modules = [
      {
        category: "Cisco CCNA",
        files: [
          { title: "CCNA Beginner: Networking Fundamentals", filename: "Complete Semester Curriculum   Cisco Networking Fundamentals (CCNA Beginner Level).md" },
          { title: "CCNA Intermediate: Complete Curriculum", filename: "CCNA Intermediate   Complete Semester Curriculum.md" },
          { title: "CCNA Advanced: Complete Curriculum", filename: "CCNA Advanced   Complete Semester Curriculum.md" }
        ]
      },
      {
        category: "Windows Server",
        files: [
          { title: "Windows Server: Basic Curriculum", filename: "Windows Server Basic   Complete Semester Curriculum.md" },
          { title: "Windows Server: Intermediate Curriculum", filename: "Windows Server Intermediate   Complete Semester Curriculum.md" },
          { title: "Windows Server: Advanced Curriculum", filename: "Windows Server Advanced   Complete Semester Curriculum.md" },
          { title: "Windows Server: Advanced (Revised)", filename: "Windows Server Advanced   Revised & Standardized Semester Curriculum.md" }
        ]
      },
      {
        category: "Integrated Infrastructure",
        files: [
          { title: "Infrastructure: Basic Track", filename: "Windows-Server-Cisco-Network-Infrastructure-Basic.md" },
          { title: "Infrastructure: Intermediate Track", filename: "Windows-Server-Cisco-Network-Infrastructure-Intermediate.md" },
          { title: "Infrastructure: Advanced Track", filename: "Windows-Server-Cisco-Network-Infrastructure-Advanced.md" }
        ]
      }
    ];

    const navContainer = document.getElementById("nav-container");
    const reader = document.getElementById("reader");
    const currentTitle = document.getElementById("current-title");
    const directFileLink = document.getElementById("direct-file-link");

    // Render Navigation
    modules.forEach(group => {
      const groupTitle = document.createElement("div");
      groupTitle.className = "nav-group-title";
      groupTitle.textContent = group.category;
      navContainer.appendChild(groupTitle);

      const ul = document.createElement("ul");
      ul.className = "nav-list";

      group.files.forEach(file => {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.className = "nav-item";
        a.textContent = file.title;
        
        // Exact relative path resolution
        const filePath = "network/" + file.filename;
        
        a.addEventListener("click", () => {
          document.querySelectorAll(".nav-item").forEach(item => item.classList.remove("active"));
          a.classList.add("active");
          loadFile(filePath, file.title);
        });

        li.appendChild(a);
        ul.appendChild(li);
      });

      navContainer.appendChild(ul);
    });

    // Fetch and render markdown cleanly
    async function loadFile(path, title) {
      currentTitle.textContent = title;
      // encodeURI safely handles special characters and repeated spaces
      const encodedPath = encodeURI(path);
      directFileLink.href = encodedPath;

      reader.innerHTML = '<div class="status-msg">Loading document...</div>';

      try {
        const response = await fetch(encodedPath);
        if (!response.ok) {
          throw new Error(`HTTP error status: ${response.status}`);
        }
        const text = await response.text();
        // Parse markdown and sanitize HTML output
        const rawHtml = marked.parse(text);
        reader.innerHTML = DOMPurify.sanitize(rawHtml);
        document.getElementById("content-container").scrollTop = 0;
      } catch (err) {
        reader.innerHTML = `
          <div class="status-msg" style="color: #ef4444;">
            <p><strong>Failed to load document</strong></p>
            <p style="font-size: 0.85rem; color: var(--muted);">${err.message}</p>
            <p style="margin-top: 1rem;">Make sure the file exists in the <code>network/</code> directory and <code>.nojekyll</code> is present in root.</p>
          </div>
        `;
      }
    }

    // Load first document automatically on start
    window.addEventListener("DOMContentLoaded", () => {
      const firstItem = document.querySelector(".nav-item");
      if (firstItem) firstItem.click();
    });
  </script>
</body>
</html>
